[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# O painel não deve aparecer no Google
[[headers]]
  for = "/painel*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/painel"
  to = "/painel.html"
  status = 200
