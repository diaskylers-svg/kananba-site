<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="description" content="KANANBA Espetos: espetos de churrasco por delivery. Peça pelo site, pague no Pix e acompanhe seu pedido ao vivo."><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>KANANBA Espetos</title>
<script>try{var t=localStorage.getItem("kananba-tema");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Estrutura de cardápio de loja: capa + cartão da loja, abas fixas, destaques, listas em linha; sacola e pedidos em painéis. Cores do site original. */
:root{
  color-scheme: dark;
  --carvao:#0a0d12; --grelha:#131922; --grelha-2:#161d27; --linha:#1e2530;
  --texto:#e7eaf1; --texto-2:#8b93a4; --texto-3:#565f70;
  --brasa:#ff9800; --brasa-forte:#FFB65C; --brasa-fundo:rgba(255,152,0,.16); --sobre-brasa:#22160a;
  --ok:#4CAF50; --azul:#8FA1F0; --azul-fundo:rgba(143,161,240,.14);
  --aviso:#f0a63c; --aviso-fundo:rgba(240,166,60,.14);
  --perigo:#ef6b6b;
  --sombra:0 10px 30px rgba(0,0,0,.45);
  --f-display:"Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --f-corpo:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:64px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --carvao:#EEF1F2; --grelha:#FFFFFF; --grelha-2:#F5F7F8; --linha:#D7DCDF;
  --texto:#1B222B; --texto-2:#5B6570; --texto-3:#8A93A0;
  --brasa-forte:#C97200; --brasa-fundo:rgba(255,152,0,.14);
  --ok:#2E7D32; --azul:#212C79; --azul-fundo:#EEF0FB;
  --aviso:#B4720E; --aviso-fundo:rgba(180,114,14,.12);
  --perigo:#B23A3A;
  --sombra:0 12px 32px -12px rgba(27,34,43,.35);
}
*{box-sizing:border-box}
html,body{background:var(--carvao);color:var(--texto)}
body{margin:0;font-family:var(--f-corpo);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
body.tem-sacola{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 88px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brasa-forte);outline-offset:2px}
.miolo{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.preco{font-family:var(--f-display);font-weight:700;font-size:1.12em;letter-spacing:.02em;font-variant-numeric:tabular-nums}
:root[data-theme="light"] .item-linha,:root[data-theme="light"] .loja-card,:root[data-theme="light"] .destaques,:root[data-theme="light"] .ped{box-shadow:0 1px 2px rgba(27,34,43,.06),0 12px 32px -16px rgba(27,34,43,.18)}

/* ===== Capa (noite de brasa nos dois modos) ===== */
.capa{height:170px;background:
  radial-gradient(120% 130% at 50% 125%, rgba(255,120,0,.55), transparent 62%),
  repeating-linear-gradient(90deg, transparent 0 22px, rgba(0,0,0,.35) 22px 26px),
  linear-gradient(180deg,#0a0d12,#1b1209);display:grid;place-items:center;padding:0 16px 40px}
.capa img{width:min(86%,440px);height:auto;filter:drop-shadow(0 0 18px rgba(255,152,0,.35))}
.loja{margin-top:-34px;position:relative}
.loja-card{background:var(--grelha);border-radius:24px;padding:52px 18px 0;text-align:center;position:relative}
.loja-acoes{position:absolute;right:8px;top:6px;display:flex;gap:2px}
.icone-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--texto)}
.icone-btn:hover{background:var(--grelha-2)}
.icone-btn svg{width:22px;height:22px}
.loja h1{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.04em;margin:4px 0 0;line-height:1;text-transform:uppercase}
.slogan{color:var(--texto-2);margin:4px 0 14px;font-size:15px}
.status{margin:0 -18px;padding:10px 16px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.status.aberto{background:#0f2a16;color:#bfe8c6;border-block:1px solid #1d4a27}
.status.fechado{background:#2a1c0b;color:#f3d9a8;border-block:1px solid #4a3212}
.neon{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.16em;padding:.12em .5em .08em .66em;border:2px solid;border-radius:10px;line-height:1.1}
.status.aberto .neon{animation:neon 2.4s infinite}
.status.fechado .neon{animation:fechado 1.6s infinite}
@keyframes neon{0%,46%{color:#fff;border-color:#fff;text-shadow:0 0 4px #fff,0 0 12px rgba(255,255,255,.7);box-shadow:0 0 10px rgba(255,255,255,.4),inset 0 0 8px rgba(255,255,255,.25)}
  50%,96%{color:#8dffa0;border-color:#5cff7a;text-shadow:0 0 3px #5cff7a,0 0 10px #4cff6e,0 0 20px rgba(76,255,110,.7);box-shadow:0 0 14px rgba(76,255,110,.6),inset 0 0 10px rgba(76,255,110,.35)}
  48%,98%{opacity:.6}}
@keyframes fechado{0%,46%{color:#ffd23f;border-color:#ffd23f;text-shadow:0 0 4px #ffd23f,0 0 12px rgba(255,210,63,.7);box-shadow:0 0 10px rgba(255,210,63,.45)}
  50%,96%{color:#ff3b3b;border-color:#ff3b3b;text-shadow:0 0 4px #ff3b3b,0 0 12px rgba(255,59,59,.7);box-shadow:0 0 10px rgba(255,59,59,.45)}
  48%,98%{opacity:.6}}
.mais-info{display:block;width:100%;border:0;background:none;padding:14px 0 16px;font-weight:700;font-size:15px}
.info-painel{text-align:left;border-top:1px solid var(--linha);padding:14px 0 18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.info-item{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--texto-2)}
.info-item b{display:block;color:var(--texto);font-weight:700}
.info-item svg{flex:none;width:20px;height:20px;color:var(--brasa);margin-top:2px}

/* ===== Abas ===== */
.abas-wrap{position:sticky;top:0;z-index:20;background:var(--grelha);margin-top:16px;border-bottom:1px solid var(--linha);padding-top:env(safe-area-inset-top,0px)}
.abas{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba-menu{flex:none;border:0;background:none;width:46px;display:grid;place-items:center;border-right:1px solid var(--linha)}
.aba{flex:none;border:0;background:none;padding:15px 14px 14px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2);position:relative;white-space:nowrap}
.aba.ativa{color:var(--brasa)}
.aba.ativa::after{content:"";position:absolute;left:50%;bottom:6px;width:34px;height:4px;border-radius:4px;background:var(--brasa);transform:translateX(-50%)}
.busca{display:flex;gap:8px;align-items:center;padding:10px 0}
.busca input{flex:1;min-width:0;background:var(--grelha-2);border:1px solid var(--linha);border-radius:12px;padding:11px 14px}

/* ===== Seções e itens ===== */
.secao{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px);padding-top:24px}
.secao h2{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 2px}
.secao h3{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;color:var(--texto-2);margin:18px 0 10px}
.secao-nota{color:var(--texto-2);font-size:14.5px;margin:0 0 12px}
.destaques{background:var(--grelha);border-radius:18px;padding:14px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}
.dest{flex:0 0 150px;scroll-snap-align:start;border:0;background:none;text-align:left;padding:0}
.dest-img{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden}
.dest-nome{font-weight:700;font-size:15px;margin:8px 0 0;line-height:1.25}
.lista{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:820px){.lista{grid-template-columns:1fr 1fr}}
.item-linha{display:flex;gap:14px;align-items:stretch;background:var(--grelha);border:0;border-radius:16px;padding:14px;text-align:left;width:100%}
.item-linha:hover{background:var(--grelha-2)}
.item-linha[aria-disabled="true"]{cursor:default;opacity:.65}
.li-texto{flex:1;min-width:0;display:flex;flex-direction:column}
.li-nome{font-weight:700;font-size:17px;line-height:1.25;margin:0 0 4px}
.li-desc{color:var(--texto-2);font-size:14.5px;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li-precos{margin-top:auto;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--azul);background:var(--azul-fundo);padding:2px 8px;border-radius:99px}
.selo{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brasa-fundo);color:var(--brasa-forte);margin-bottom:6px;align-self:flex-start}
.li-img{flex:none;width:108px;height:108px;border-radius:12px;overflow:hidden;position:relative;background:var(--grelha-2)}
.thumb,.foto{width:100%;height:100%;display:block;object-fit:cover}
.thumb{background:radial-gradient(90% 90% at 50% 100%,#3a1c06,#16100c 70%)}
.mais{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:9px;background:var(--brasa);color:var(--sobre-brasa);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mais svg{width:18px;height:18px}
.qtd-sel{position:absolute;left:6px;top:6px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--brasa);color:var(--sobre-brasa);font-weight:800;font-size:13px;display:grid;place-items:center}
.vazio-busca{color:var(--texto-2);text-align:center;padding:30px 0}
.rodape{color:var(--texto-3);font-size:13px;text-align:center;padding:28px 0 8px}

/* ===== Barra da sacola + navegação ===== */
.barra-sacola{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;padding:10px 16px}
.barra-sacola button{max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:14px;background:var(--brasa);color:var(--sobre-brasa);padding:13px 16px;font-weight:700;box-shadow:var(--sombra)}
.bs-qtd{background:rgba(0,0,0,.18);border-radius:8px;padding:1px 9px}
.bs-total{margin-left:auto;font-family:var(--f-display);font-size:19px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--grelha);border-top:1px solid var(--linha);padding:0 16px env(safe-area-inset-bottom,0px)}
.nav-in{max-width:1040px;margin:0 auto;height:var(--nav-h);display:flex;justify-content:space-between;align-items:center}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--texto-2);padding:6px 14px;position:relative}
.nav button svg{width:26px;height:26px}
.nav button.ativo{color:var(--brasa)}
.badge{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:99px;background:var(--brasa);color:var(--sobre-brasa);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* ===== Meus pedidos ===== */
.topo-pg{position:sticky;top:0;z-index:20;background:var(--grelha);border-bottom:1px solid var(--linha);padding-top:env(safe-area-inset-top,0px)}
.topo-pg .miolo{display:flex;align-items:center;gap:10px;height:62px}
.topo-pg h1{font-family:var(--f-display);font-size:24px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:0}
.abas-ped{background:var(--grelha);display:flex;gap:6px;border-radius:0 0 14px 14px;padding:0 10px}
.pedidos{display:grid;gap:12px;padding-top:16px}
.vazio{color:var(--texto-2);text-align:center;padding:60px 0;display:grid;gap:12px;justify-items:center}
.vazio svg{width:54px;height:54px;color:var(--texto-3)}
.ped{background:var(--grelha);border-radius:16px;padding:16px;display:grid;gap:12px;border:0;text-align:left;width:100%}
.ped-topo{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ped-cod{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.03em}
.ped-quando{color:var(--texto-2);font-size:14px}
.pill{margin-left:auto;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--azul-fundo);color:var(--azul)}
.pill.s-aguardando_pagamento{background:var(--aviso-fundo);color:var(--aviso)}
.pill.s-em_preparo{background:var(--brasa-fundo);color:var(--brasa-forte)}
.pill.s-concluido{background:rgba(76,175,80,.14);color:var(--ok)}
.pill.s-cancelado{background:rgba(239,107,107,.13);color:var(--perigo)}
.etapas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--texto-3);text-align:center}
.etapas li{display:grid;gap:6px;justify-items:center}
.etapas .bar{height:5px;width:100%;border-radius:4px;background:var(--linha)}
.etapas li.feito{color:var(--texto-2)}
.etapas li.feito .bar{background:var(--brasa)}
.etapas li.atual{color:var(--brasa-forte);font-weight:700}
.etapas li.atual .bar{background:linear-gradient(90deg,var(--brasa) 50%,var(--linha) 50%);background-size:200% 100%;animation:enche 1.8s linear infinite}
@keyframes enche{from{background-position:100% 0}to{background-position:0 0}}
.ped-itens{font-size:15px;color:var(--texto-2)}
.ped-base{display:flex;align-items:center;gap:10px;border-top:1px solid var(--linha);padding-top:12px}
.ped-base .preco{margin-left:auto}
.ped-ver{color:var(--brasa-forte);font-weight:700;font-size:14px}

/* ===== Painéis ===== */
.fundo{position:fixed;inset:0;background:rgba(3,5,8,.7);z-index:40;animation:surge .2s}
:root[data-theme="light"] .fundo{background:rgba(27,34,43,.35)}
.painel{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);background:var(--grelha);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:sobe .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.painel{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:min(90%,860px);border-radius:22px;transform:translate(-50%,-50%);animation:surge .2s}}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
@keyframes surge{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.p-topo{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--linha)}
.p-topo h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0}
.p-corpo{overflow-y:auto;padding:16px 18px 20px;display:grid;gap:18px;align-content:start}
.p-corpo>*{min-width:0}
.p-pe{border-top:1px solid var(--linha);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
.p-pe:empty{display:none}
.p-hero{border-radius:16px;overflow:hidden;height:190px}
.p-nome{font-family:var(--f-display);font-size:28px;font-weight:900;letter-spacing:.03em;margin:0;line-height:1.05;text-transform:uppercase}
.p-desc{color:var(--texto-2);margin:4px 0 0}
.grupo{display:grid;gap:4px}
.grupo-cab{display:flex;align-items:center;gap:10px;background:var(--grelha-2);margin:0 -18px 4px;padding:10px 18px}
.grupo-cab b{font-weight:700}
.grupo-cab small{display:block;color:var(--texto-2);font-size:13px}
.obrig{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--texto);color:var(--grelha);white-space:nowrap}
.obrig.ok{background:var(--ok);color:#fff}
.opcao{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--linha)}
.opcao:last-child{border-bottom:0}
.o-txt{flex:1;min-width:0}
.o-txt small{display:block;color:var(--texto-2);font-size:13.5px}
.opcao input[type=radio],.opcao input[type=checkbox]{width:22px;height:22px;accent-color:var(--brasa);flex:none}
label.opcao{cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.chip{border:1px solid var(--linha);background:var(--grelha-2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--brasa);background:var(--brasa-fundo);color:var(--brasa-forte)}
.passo{display:inline-flex;align-items:center;border:1px solid var(--linha);border-radius:12px;overflow:hidden;flex:none}
.passo button{border:0;background:none;width:38px;height:38px;display:grid;place-items:center;color:var(--brasa);font-size:20px;font-weight:800}
.passo button:disabled{color:var(--texto-3);cursor:default}
.passo span{min-width:26px;text-align:center;font-weight:700}
.obs{display:grid;gap:6px}
.obs>label{font-weight:700;display:flex;align-items:center;gap:6px}
.obs>label svg{width:18px;height:18px;color:var(--brasa)}
.obs textarea,.campo input{width:100%;background:var(--grelha-2);border:1px solid var(--linha);border-radius:12px;padding:11px 13px;resize:vertical}
.obs textarea{min-height:76px;border-color:color-mix(in srgb,var(--brasa) 50%,transparent)}
.obs small,.dica{color:var(--texto-3);font-size:13px}
.dica.ok{color:var(--ok)} .dica.erro{color:var(--perigo)}
.campo input.invalido{border-color:var(--perigo)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-p{background:var(--brasa);color:var(--sobre-brasa);flex:1}
.btn-p:disabled{background:var(--grelha-2);color:var(--texto-3);cursor:not-allowed}
.btn-s{background:var(--grelha-2);color:var(--texto)}
.btn-perigo{background:none;border:1px solid var(--linha);color:var(--perigo)}
.lk{border:0;background:none;font-weight:700;font-size:14px;padding:4px 0}
.lk-edit{color:var(--brasa-forte)} .lk-rem{color:var(--perigo)}
.sac-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding-bottom:14px;border-bottom:1px solid var(--linha)}
.si-nome{font-weight:700}
.si-det{color:var(--texto-2);font-size:14px}
.si-obs{color:var(--brasa-forte);font-size:14px;font-weight:600}
.sac-acoes{display:flex;gap:14px}
.totais{display:grid;gap:6px;font-size:15px}
.totais div{display:flex;justify-content:space-between;gap:10px;color:var(--texto-2)}
.totais .t-final{color:var(--texto);font-weight:700;font-size:18px;padding-top:6px;border-top:1px solid var(--linha)}
.segmento{display:grid;grid-template-columns:1fr 1fr;background:var(--grelha-2);border-radius:12px;padding:4px;gap:4px}
.segmento button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--texto-2)}
.segmento button[aria-pressed="true"]{background:var(--brasa);color:var(--sobre-brasa)}
.campos{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.campo{display:grid;gap:5px;font-size:14px;font-weight:600;color:var(--texto-2);min-width:0}
.campo.l2{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--texto-2)}
.check input{width:18px;height:18px;accent-color:var(--brasa)}
.erro{background:rgba(239,107,107,.13);color:var(--perigo);border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:600}
.aviso{background:var(--aviso-fundo);color:var(--aviso);border-radius:10px;padding:10px 12px;font-size:14.5px}
.ok-box{background:rgba(76,175,80,.14);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700}
.pix{background:var(--grelha-2);border-radius:16px;padding:16px;display:grid;gap:12px;justify-items:center;text-align:center}
.pix-topo{display:flex;justify-content:space-between;width:100%;align-items:center;text-align:left}
.pix-topo small{display:block;color:var(--texto-2)}
.pix-topo strong{font-family:var(--f-display);font-size:28px}
.pix-relogio{font-weight:700;color:var(--aviso)}
.pix-qr{width:210px;height:210px;background:#fff;border-radius:12px;padding:8px}
.pix-codigo{width:100%;font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:var(--grelha);border:1px dashed var(--linha);border-radius:10px;padding:10px;max-height:84px;overflow:auto;text-align:left}
.giro{display:inline-block;width:14px;height:14px;border:2px solid var(--linha);border-top-color:var(--brasa);border-radius:50%;animation:gira 1s linear infinite;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}
.fila{display:flex;gap:12px;align-items:flex-start;background:var(--brasa-fundo);border-radius:12px;padding:12px}
.fila small{display:block;color:var(--texto-2)}
.rev{display:grid;gap:10px;font-size:15px}
.rev small{display:block;color:var(--texto-3);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stepper{display:flex;gap:6px;margin:-4px 0 0}
.stepper button{flex:1;border:0;background:none;padding:0;display:grid;gap:6px;justify-items:center;font-size:13px;font-weight:700;color:var(--texto-3)}
.stepper button:disabled{cursor:default}
.stepper .bola{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--linha);background:var(--grelha-2)}
.stepper .atual{color:var(--brasa-forte)} .stepper .atual .bola{border-color:var(--brasa);color:var(--brasa-forte)}
.stepper .feito{color:var(--texto-2)} .stepper .feito .bola{background:var(--brasa);border-color:var(--brasa);color:var(--sobre-brasa)}
.prog{height:4px;border-radius:4px;background:var(--linha);overflow:hidden}.prog i{display:block;height:100%;background:var(--brasa);transition:width .25s}
.resumo-etapa{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--grelha-2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.resumo-etapa small{display:block;color:var(--texto-3);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 90px);z-index:60;background:var(--texto);color:var(--grelha);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:var(--sombra);max-width:calc(100% - 32px)}
</style></head><body>

  <div class="abas-wrap">

      <div class="busca" id="busca" hidden><input id="busca-in" type="search" placeholder="Buscar espeto, combo, bebida…" autocomplete="off"><button class="icone-btn" id="busca-fechar" type="button" aria-label="Fechar busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

  <div class="p-topo"><h3 id="p-titulo"></h3><button class="icone-btn" id="p-fechar" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="p-corpo" id="p-corpo"></div>
  <div class="p-pe" id="p-pe"></div>
</section>
<div class="toast" id="toast" hidden></div>

<script type="module">
/* Cardápio, preços, taxa e horário vêm de loja.mjs (o servidor usa o mesmo arquivo e recalcula os valores) */
import { NEGOCIO, CARDAPIO, COMBOS } from "./loja.mjs";

const PONTOS_CARNE = ["Mal passado","Ao ponto","Bem passado"];
const PONTOS_FRANGO = ["Normal","Bem douradinho"];
const ROT = {aguardando_pagamento:"Aguardando pagamento", novo:"Pedido recebido", em_preparo:"Na brasa 🔥", saiu:"Saiu para entrega 🛵", pronto:"Pronto para retirar", concluido:"Concluído", cancelado:"Cancelado"};
const FINAIS = ["concluido","cancelado"];

const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = t => String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const so = t => String(t??"").replace(/\D/g,"");
const ler = (k,p)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v??p; }catch(e){ return p; } };
const guardar = (k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const ICON_MAIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_OBS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2400); }

/* ============ dados do cardápio ============ */
const ESPETOS = CARDAPIO.filter(i=>i.grupo==="espetos");
const ACOMP = CARDAPIO.filter(i=>i.grupo==="acomp" && !i.oculto);
const BEBIDAS = CARDAPIO.filter(i=>i.grupo==="bebidas");
const porId = id => CARDAPIO.find(i=>i.id===id) || COMBOS.find(c=>c.id===id);
const ehCombo = o => COMBOS.includes(o);
const nomeCurtoCombo = c => `Combo ${c.espetos} espetos`;
const incluiCombo = c => c.nome.split("+").slice(1).join("+").trim();
const SECOES = [
  {id:"combos", nome:"Combos", nota:"Você escolhe os sabores. Pra dividir com a galera."},
  {id:"espetos", nome:"Espetos", nota:"8 cubos em cada. Só o espeto ou Completinho ("+NEGOCIO.completinhoDesc.replace(/^\+ ?/,"com ")+")."},
  {id:"acomp", nome:"Acompanhamentos", nota:"Porções avulsas."},
  {id:"bebidas", nome:"Bebidas", nota:"Geladas."}
];
let FOTOS = {}, DESTAQUES = {fonte:"casa", ids:{}}, FILA = null, CFG = {cartao:false, publicKey:null};
const CARTAO = "Cartão de crédito";
const formasPag = ()=> NEGOCIO.pagamentos.filter(p=>p!==CARTAO || CFG.cartao);

/* ============ desenhos (quando não há foto) ============ */
const CORES = {coxao:['#a0461c','#8a3a16'], alcatra:['#8a3418','#a0461c'], paleta:['#6e2a10','#8a3a16'], misto:['#a0461c','#e8b26a'], frango:['#e8b26a','#d99c4f'],
  frangobacon:['#e8b26a','#b8452e'], asa:['#d98a3a','#e8b26a'], coracao:['#7a1e1a'], toscana:['#c46a45'], calabresa:['#8e2a1f']};
function svgEspeto(id){
  const c = CORES[id]||CORES.coxao, red = ["toscana","calabresa","coracao"].includes(id);
  let cub=""; for(let i=0;i<8;i++){ const x=36+i*17, f=c[i%c.length];
    cub += red ? `<ellipse cx="${x+7}" cy="100" rx="${id==="coracao"?6:8}" ry="${id==="coracao"?8:12}" fill="${f}"/>`
               : `<rect x="${x}" y="88" width="15" height="24" rx="${id==="asa"?7:4}" fill="${f}"/><rect x="${x+2}" y="90" width="4" height="9" rx="2" fill="#fff" opacity=".12"/>`; }
  return `<svg class="thumb" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><ellipse cx="100" cy="190" rx="110" ry="40" fill="#ff7a00" opacity=".2"/>
    <g fill="#ff9800" opacity=".35">${[30,62,96,130,164].map((x,i)=>`<circle cx="${x}" cy="${172+(i%2)*8}" r="${3+(i%3)}"/>`).join("")}</g>
    <g transform="rotate(-18 100 100)"><line x1="10" y1="100" x2="196" y2="100" stroke="#b9aa9c" stroke-width="3" stroke-linecap="round"/>${cub}<rect x="4" y="94" width="20" height="12" rx="3" fill="#5c3b20"/></g></svg>`;
}
function svgPote(id){
  const cor = {baiao:["#e2c48e","#6b3a1c"], arroz:["#f4efe4","#d8cfbf"], vinagrete:["#c8362a","#3f8a3a"], farofa:["#d8b46a","#a8742a"]}[id]||["#e2c48e","#6b3a1c"];
  let p=""; for(let i=0;i<24;i++) p+=`<circle cx="${60+((i*37)%80)}" cy="${86+((i*23)%24)}" r="${2+(i%3)}" fill="${cor[1]}" opacity=".8"/>`;
  return `<svg class="thumb" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><ellipse cx="100" cy="190" rx="110" ry="40" fill="#ff7a00" opacity=".14"/>
    <ellipse cx="100" cy="98" rx="62" ry="22" fill="${cor[0]}"/>${p}<path d="M38 98c0 34 28 52 62 52s62-18 62-52" fill="#7a5a3a"/></svg>`;
}
function svgCombo(c){
  const sab=["coxao","frango","misto","paleta"].slice(0,c.espetos);
  const g = sab.map((id,i)=>`<g transform="translate(0 ${-30+i*20})">${svgEspeto(id).replace(/^[\s\S]*?<g transform="rotate/,'<g transform="rotate').replace(/<\/svg>$/,"")}</g>`).join("");
  return `<svg class="thumb" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><ellipse cx="100" cy="190" rx="110" ry="40" fill="#ff7a00" opacity=".22"/>${g}<text x="188" y="190" text-anchor="end" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="40" fill="#ff9800">${c.espetos}×</text></svg>`;
}
function svgBebida(b){
  const cor = /coca/i.test(b.id)?"#c8102e":/fanta/i.test(b.id)?"#f57c00":/guarana/i.test(b.id)?"#2e7d32":/pureza/i.test(b.id)?"#e0b400":b.sub==="cervejas"?"#e8b23a":b.sub==="sucos"?"#ff9800":"#8FA1F0";
  const corpo = b.id.startsWith("lata")||b.sub==="cervejas"
    ? `<rect x="74" y="52" width="52" height="100" rx="10" fill="${cor}"/><rect x="78" y="46" width="44" height="10" rx="4" fill="#c9ced6"/><rect x="74" y="88" width="52" height="22" fill="#fff" opacity=".2"/>`
    : b.sub==="sucos" ? `<path d="M70 50h60l-8 102a6 6 0 0 1-6 5H84a6 6 0 0 1-6-5z" fill="#8FA1F0" opacity=".3"/><path d="M73 80h54l-5 72a6 6 0 0 1-6 5H84a6 6 0 0 1-6-5z" fill="${cor}"/>`
    : `<path d="M88 40h24v14c10 6 14 14 14 24v70a8 8 0 0 1-8 8H82a8 8 0 0 1-8-8V78c0-10 4-18 14-24z" fill="${cor}"/><rect x="88" y="32" width="24" height="10" rx="3" fill="#333"/><rect x="74" y="92" width="52" height="24" fill="#fff" opacity=".2"/>`;
  return `<svg class="thumb" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><ellipse cx="100" cy="190" rx="110" ry="40" fill="#8FA1F0" opacity=".12"/>${corpo}</svg>`;
}
function imagem(o){
  if(FOTOS[o.id]) return `<img class="foto" src="/api/foto/${encodeURIComponent(o.id)}?v=${encodeURIComponent(FOTOS[o.id])}" alt="" loading="lazy">`;
  return ehCombo(o) ? svgCombo(o) : o.grupo==="espetos" ? svgEspeto(o.id) : o.grupo==="bebidas" ? svgBebida(o) : svgPote(o.id);
}

/* ============ horário ============ */
function minutosSP(){
  const p = new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  return (+p.find(x=>x.type==="hour").value%24)*60 + (+p.find(x=>x.type==="minute").value);
}
const hm = m => { const h=Math.floor(m/60), mm=m%60; return `${h}h${mm?String(mm).padStart(2,"0"):""}`; };
function aberto(){ try{ const m=minutosSP(); return NEGOCIO.abre>NEGOCIO.fecha ? (m>=NEGOCIO.abre||m<NEGOCIO.fecha) : (m>=NEGOCIO.abre&&m<NEGOCIO.fecha); }catch(e){ return false; } }
function pintarStatus(){
  const ab = aberto();
  $("status").className = "status "+(ab?"aberto":"fechado");
  $("neon").textContent = ab ? "ABERTO" : "FECHADO";
  $("status-txt").textContent = ab ? `Pedidos até ${hm(NEGOCIO.fecha)}` : `Abrimos hoje às ${hm(NEGOCIO.abre)}`;
}

/* ============ sacola ============ */
let sacola = ler("kananba-sacola2", []).filter(l=>porId(l.id));
const totalSacola = ()=> sacola.reduce((s,l)=>s+l.unit*l.qtd,0);
const qtdSacola = ()=> sacola.reduce((s,l)=>s+l.qtd,0);
const qtdNoCarrinho = id => sacola.filter(l=>l.id===id).reduce((s,l)=>s+l.qtd,0);
function salvarSacola(){ guardar("kananba-sacola2", sacola); pintarSacola(); pintarCardapio(); }
function pintarSacola(){
  const q=qtdSacola(), naInicio=!$("v-inicio").hidden;
  $("barra-sacola").hidden = !q || !naInicio;
  document.body.classList.toggle("tem-sacola", !!q && naInicio);
  $("bs-qtd").textContent=q; $("bs-total").textContent=brl(totalSacola());
}

/* ============ cardápio ============ */
function selo(o){
  const g = ehCombo(o)?"combos":o.grupo;
  if(DESTAQUES.ids?.[g]!==o.id) return "";
  return DESTAQUES.fonte==="pedidos" ? `<span class="selo">🔥 Mais pedido</span>` : `<span class="selo">⭐ Sugestão da casa</span>`;
}
function linha(o){
  const combo = ehCombo(o), semPreco = o.preco==null;
  const nome = combo ? nomeCurtoCombo(o) : o.nome;
  const desc = combo ? o.desc + (o.adicionais?.length?" Vinagrete e farofa opcionais.":"") : (o.desc||"") ;
  const preco = semPreco ? `<span class="tag">Preço em breve</span>`
    : o.precoCompleto!=null ? `<span class="preco">${brl(o.preco)}</span><span class="tag">Completinho ${brl(o.precoCompleto)}</span>`
    : `<span class="preco">${brl(o.preco)}</span>${o.alcool?`<span class="tag">+18</span>`:""}`;
  const q = qtdNoCarrinho(o.id);
  return `<button class="item-linha" type="button" data-abrir="${o.id}" ${semPreco?'aria-disabled="true"':""} data-busca="${esc((nome+" "+desc).toLowerCase())}">
    <div class="li-texto">${selo(o)}<p class="li-nome">${esc(nome)}</p><p class="li-desc">${esc(desc)}</p><div class="li-precos">${preco}</div></div>
    <div class="li-img">${imagem(o)}${q?`<span class="qtd-sel">${q}</span>`:""}${semPreco?"":`<span class="mais">${ICON_MAIS}</span>`}</div></button>`;
}
function pintarCardapio(){
  const ids = Object.values(DESTAQUES.ids||{}).filter(Boolean);
  const dest = [...new Set([...ids, "combo4", "misto", "alcatra"])].map(porId).filter(o=>o && o.preco!=null);
  const blocos = {
    combos: `<div class="lista">${COMBOS.map(linha).join("")}</div>`,
    espetos: `<div class="lista">${ESPETOS.map(linha).join("")}</div>`,
    acomp: `<div class="lista">${ACOMP.map(linha).join("")}</div>`,
    bebidas: [...new Set(BEBIDAS.map(b=>b.secao))].map(sec=>`<div class="subsec"><h3>${esc(sec)}</h3><div class="lista">${BEBIDAS.filter(b=>b.secao===sec).map(linha).join("")}</div></div>`).join("")
  };
  $("cardapio").innerHTML =
    `<section class="secao" id="s-destaques"><h2>Destaques</h2><div class="destaques">${dest.map(o=>`
      <button class="dest" type="button" data-abrir="${o.id}"><div class="dest-img">${imagem(o)}<span class="mais">${ICON_MAIS}</span></div>
      <p class="dest-nome">${esc(ehCombo(o)?nomeCurtoCombo(o):o.nome)}</p><span class="preco">${brl(o.preco)}</span></button>`).join("")}</div></section>` +
    SECOES.map(s=>`<section class="secao" id="s-${s.id}"><h2>${s.nome}</h2><p class="secao-nota">${esc(s.nota)}</p>${blocos[s.id]}</section>`).join("") +
    `<p class="vazio-busca" id="sem-result" hidden>Nada encontrado com esse nome.</p>`;
  filtrar();
}
function pintarAbas(){

function abrirCombo(id, lin){

  const pinta = ()=>{
    const soma = Object.values(st.sab).reduce((a,b)=>a+b,0), ok = soma===cb.espetos, falta=cb.espetos-soma;
    const extrasOpc = (cb.adicionais||[]).map(porId).filter(Boolean);
    const unit = cb.preco + st.extras.reduce((s,i)=>s+porId(i).preco,0);
    let c = `<div class="p-hero">${imagem(cb)}</div><div><p class="p-nome">${esc(nomeCurtoCombo(cb))}</p><p class="p-desc">${esc(cb.desc)}</p></div>
      <div class="grupo"><div class="grupo-cab"><div><b>Escolha os sabores</b><small>${soma} de ${cb.espetos} escolhidos</small></div><span class="obrig ${ok?"ok":""}">${ok?"Pronto":"Obrigatório"}</span></div>
      ${sabores.map(e=>`<div class="opcao"><span class="o-txt">${esc(e.nome)}</span>${passoHTML("s:"+e.id, st.sab[e.id]||0, 0, (st.sab[e.id]||0)+falta)}</div>`).join("")}</div>`;

      ${extrasOpc.map(a=>`<label class="opcao"><input type="checkbox" data-extra="${a.id}" ${st.extras.includes(a.id)?"checked":""}><span class="o-txt">${esc(a.nome)}</span><span class="preco">+ ${brl(a.preco)}</span></label>`).join("")}</div>`;
    c += obsHTML(st.obs,"Ex.: coxão ao ponto, frango bem douradinho…");

    $("p-pe").innerHTML = `${passoHTML("q",st.qtd,1,10)}<button class="btn btn-p" id="p-add" type="button" ${ok?"":"disabled"}>${ok?`${lin?"Atualizar":"Adicionar"} <span class="preco">${brl(unit*st.qtd)}</span>`:`Faltam ${falta} sabor${falta>1?"es":""}`}</button>`;

    $("p-pe").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ obs(); st.qtd=Math.min(10,Math.max(1,st.qtd + +b.dataset.d)); manterRolagem(pinta); });
    $("p-add").onclick=()=>{
      if(!ok) return;
      const det=[Object.entries(st.sab).map(([k,v])=>`${v}× ${porId(k).nome}`).join(", "), "Acompanha "+incluiCombo(cb)];

      const nova={key:lin?.key||novaChave(), id:cb.id, combo:true, nome:nomeCurtoCombo(cb), qtd:st.qtd, unit, sabores:st.sab, extras:st.extras, det, obs:$("p-obs").value.trim()};

      if(lin) abrirSacola();

  };
  abrirPainel(lin?"Editar combo":"Monte seu combo"); pinta();

function cpfValido(c){
  c=so(c); if(c.length!==11 || /^(\d)\1{10}$/.test(c)) return false;
  for(const n of [9,10]){ let s=0; for(let i=0;i<n;i++) s+= +c[i]*(n+1-i); let d=(s*10)%11; if(d===10) d=0; if(d!== +c[n]) return false; }
  return true;
}
const mascCPF=v=>{ v=so(v).slice(0,11); return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/,".$1-$2"); };
const mascTel=v=>{ v=so(v).slice(0,11); if(v.length<=2) return v.length?`(${v}`:""; if(v.length<=6) return `(${v.slice(0,2)}) ${v.slice(2)}`; if(v.length<=10) return `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`; return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`; };
const mascCEP=v=>{ v=so(v).slice(0,8); return v.length>5?v.slice(0,5)+"-"+v.slice(5):v; };

    if(n<11){ d.textContent=""; d.className="dica"; } else if(cpfValido(e.target.value)){ d.textContent="CPF válido ✓"; d.className="dica ok"; } else { d.textContent="Esse CPF não parece correto."; d.className="dica erro"; } };
    $("f-cpf").dispatchEvent(new Event("input")); }
  if($("f-tel")) $("f-tel").oninput=e=>{ e.target.value=mascTel(e.target.value); e.target.classList.remove("invalido"); };
  if($("f-semnum")) $("f-semnum").onchange=e=>{ $("f-num").disabled=e.target.checked; if(e.target.checked) $("f-num").value=""; };
  if($("f-cep")){ let ult=""; $("f-cep").oninput=async e=>{
    e.target.value=mascCEP(e.target.value); const cep=so(e.target.value), d=$("cep-dica");
    if(cep.length<8||cep===ult) return; ult=cep; d.textContent="Buscando endereço…"; d.className="dica";
    try{ const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`); const j=await r.json(); if(cep!==ult) return;
      if(j.erro){ d.textContent="CEP não encontrado. Preencha abaixo."; d.className="dica erro"; return; }
      if(j.logradouro) $("f-rua").value=j.logradouro; if(j.bairro) $("f-bairro").value=j.bairro; if(j.localidade) $("f-cidade").value=j.localidade+(j.uf?" - "+j.uf:"");
      d.textContent="Endereço encontrado ✓ Agora é só o número."; d.className="dica ok"; $("f-num").focus();
    }catch(err){ d.textContent="Não deu para buscar o CEP agora. Preencha abaixo."; d.className="dica erro"; } }; }
  if(!erroMsg && matchMedia("(hover:hover)").matches){ const f=$("p-corpo").querySelector(".campos input:not([disabled])"); if(f && !f.value) setTimeout(()=>f.focus(),60); }
  $("ck-voltar").onclick=()=>{ lerForm(); guardarCliente(); if(ckEtapa===0) abrirSacola(); else abrirCheckout(null,ckEtapa-1); };
  $("ck-enviar").onclick= final ? enviarPedido : avancar;
}
function avancar(){
  lerForm(); guardarCliente();
  const f=faltaEtapa(ckEtapa);
  if(f.length){ mostrarFaltas(f); return; }
  abrirCheckout(null, ckEtapa+1);
}
function mostrarFaltas(f){
  manterRolagem(()=>abrirCheckout("Falta preencher: "+f.map(x=>x[1]).join(", ")+"."));
  f.forEach(x=>x[0]&&$(x[0])?.classList.add("invalido"));
  const prim=f.find(x=>x[0]&&$(x[0])); if(prim) $(prim[0]).focus();
}
function guardarCliente(){ const {pag,troco,...resto}=cli; guardar("kananba-cliente2", resto); }
function faltaEtapa(e){
  const f=[];
  if(e===0){ if(cli.nome.length<2) f.push(["f-nome","seu nome"]); if(!cpfValido(cli.cpf)) f.push(["f-cpf", so(cli.cpf).length?"um CPF válido":"seu CPF"]); if(so(cli.tel).length<10) f.push(["f-tel","um celular com DDD"]); }
  if(e===1 && cli.modo==="Entrega"){ if(!cli.rua) f.push(["f-rua","a rua"]); if(!cli.numero && !cli.semNumero) f.push(["f-num","o número"]); if(!cli.bairro) f.push(["f-bairro","o bairro"]); }
  if(e===2 && (!cli.pag || !formasPag().includes(cli.pag))) f.push([null,"a forma de pagamento"]);
  return f;
}
async function enviarPedido(){
  lerForm(); guardarCliente();
  for(const e of [0,1,2]){ const f=faltaEtapa(e); if(f.length){ ckEtapa=e; mostrarFaltas(f); return; } }
  const b=$("ck-enviar"); b.disabled=true; b.textContent = cli.pag==="Pix"?"Gerando seu Pix…":cli.pag===CARTAO?"Preparando o pagamento…":"Enviando pedido…";
  const itens=[];
  for(const l of sacola){
    if(l.combo){ for(let k=0;k<l.qtd;k++) itens.push({id:l.id, qtd:1, sabores:l.sabores, extras:l.extras, obs:l.obs||null}); }
    else itens.push({id:l.id, qtd:l.qtd, completo:!!l.completo, ponto:l.ponto||null, obs:l.obs||null});
  }
  const corpo = { itens, obsGeral:cli.obsGeral,
    cliente:{nome:cli.nome, cpf:cli.cpf, tel:cli.tel, telWhats:cli.telWhats},
    entrega:{modo:cli.modo, cep:cli.cep, cidade:cli.cidade, rua:cli.rua, numero:cli.numero, semNumero:cli.semNumero, complemento:cli.complemento, bairro:cli.bairro, referencia:cli.referencia},
    pagamento:{forma:cli.pag, troco: cli.pag==="Dinheiro"?cli.troco:null} };
  try{
    const r=await fetch("/api/pedidos",{method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(corpo)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.erro||"Não foi possível enviar o pedido. Tente de novo.");
    sacola=[]; cli.obsGeral=""; salvarSacola(); guardarCliente();
    registrarPedido(d.pedido.id, d.token, d.pedido);
    abrirDetalhe(d.pedido.id);
  }catch(e){
    manterRolagem(()=>abrirCheckout(/fetch|network/i.test(e.message)?"Sem conexão com o servidor. Confira sua internet e tente de novo.":e.message));
  }
}

/* ============ meus pedidos ============ */
// lista guardada no aparelho: [{id, token, dados}]
let meus = ler("kananba-meus-pedidos", []);
(function migrar(){ const g=ler("kananba-pedido",null); if(g?.id && g?.token && !meus.some(m=>m.id===g.id)) meus.unshift({id:g.id, token:g.token, dados:null}); })();
const salvarMeus=()=>{ meus=meus.slice(0,15); guardar("kananba-meus-pedidos", meus); };
function registrarPedido(id, token, dados){ meus=meus.filter(m=>m.id!==id); meus.unshift({id, token, dados}); salvarMeus(); pintarBadge(); }
const ativo = m => m.dados && !FINAIS.includes(m.dados.status);
let abaPed="and", detalheId=null, timerPoll=null, timerRelogio=null, pagoAgora=null;

async function atualizarPedido(m){
  try{
    const r=await fetch(`/api/pedidos/${encodeURIComponent(m.id)}?t=${encodeURIComponent(m.token)}`,{cache:"no-store"});
    if(r.status===404){ meus=meus.filter(x=>x.id!==m.id); salvarMeus(); return false; }
    const d=await r.json();
    if(d.pedido){
      if(m.dados?.pagamento?.status==="pendente" && d.pedido.pagamento.status==="pago"){ pagoAgora=m.id; try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){} }
      const mudou = JSON.stringify(m.dados)!==JSON.stringify(d.pedido);
      m.dados=d.pedido; salvarMeus(); return mudou;
    }
  }catch(e){}
  return false;
}
async function atualizarTodos(){
  const alvo = meus.filter(m=>!m.dados || !FINAIS.includes(m.dados.status));
  const res = await Promise.all(alvo.map(atualizarPedido));
  if(res.some(Boolean) || alvo.length){ pintarBadge(); if(!$("v-pedidos").hidden) pintarPedidos(); if(detalheId && !$("painel").hidden) pintarDetalhe(); }
  agendarPoll();
}
function agendarPoll(){
  clearTimeout(timerPoll);
  const at = meus.filter(ativo); if(!at.length) return;
  const rapido = at.some(m=>m.dados.status==="aguardando_pagamento") && (detalheId || !$("v-pedidos").hidden);
  timerPoll=setTimeout(atualizarTodos, rapido?4000:15000);
}
function pintarBadge(){ const n=meus.filter(ativo).length; $("nav-badge").hidden=!n; $("nav-badge").textContent=n; }
function passosDe(p){ return p.entrega.modo==="Entrega" ? [["novo","Recebido"],["em_preparo","Na brasa"],["saiu","A caminho"],["concluido","Entregue"]] : [["novo","Recebido"],["em_preparo","Na brasa"],["pronto","Pronto"],["concluido","Retirado"]]; }
function etapasHTML(p){
  if(p.status==="cancelado" || p.status==="aguardando_pagamento") return "";
  const ps=passosDe(p), idx=ps.findIndex(x=>x[0]===p.status);
  return `<ol class="etapas">${ps.map((x,i)=>`<li class="${i<idx||p.status==="concluido"?"feito":i===idx?"atual":""}"><span class="bar"></span>${x[1]}</li>`).join("")}</ol>`;
}
const quando = iso => { try{ return new Date(iso).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(","," às"); }catch(e){ return ""; } };
function pintarPedidos(){
  const lista = meus.filter(m=>m.dados && (abaPed==="and" ? !FINAIS.includes(m.dados.status) : FINAIS.includes(m.dados.status)));
  $("lista-ped").innerHTML = lista.length ? lista.map(m=>{ const p=m.dados; return `<button class="ped" type="button" data-ped="${m.id}">
      <div class="ped-topo"><div><div class="ped-cod">Pedido #${esc(p.codigo)}</div><div class="ped-quando">${quando(p.criadoEm)} · ${p.entrega.modo==="Entrega"?"Entrega":"Retirada"}</div></div><span class="pill s-${p.status}">${ROT[p.status]||p.status}</span></div>
      ${etapasHTML(p)}
      <div class="ped-itens">${p.itens.map(i=>`${i.qtd}× ${esc(i.nome)}`).join(" · ")}</div>
      <div class="ped-base"><span class="ped-ver">${p.status==="aguardando_pagamento"?(p.pagamento.forma===CARTAO?"Pagar com cartão →":"Pagar com Pix →"):"Ver detalhes →"}</span><span class="preco">${brl(p.total)}</span></div></button>`; }).join("")
    : `<div class="vazio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>${abaPed==="and"?"Nenhum pedido em andamento.":"Nenhum pedido finalizado ainda."}${abaPed==="and"?`<button class="btn btn-p" type="button" id="ir-cardapio" style="flex:none">Ver cardápio</button>`:""}</div>`;
  $("lista-ped").querySelectorAll("[data-ped]").forEach(b=>b.onclick=()=>abrirDetalhe(b.dataset.ped));
  $("ir-cardapio")?.addEventListener("click",()=>mostrar("inicio"));
}

function abrirDetalhe(id){
  detalheId=id; abrirPainel("Pedido"); aoFechar=()=>{ detalheId=null; };
  pintarDetalhe(); agendarPoll();
}
let brickChave=null, brickCtrl=null;
function pintarDetalhe(){
  const m = meus.find(x=>x.id===detalheId); if(!m?.dados){ fecharPainel(); return; }
  const p=m.dados, pg=p.pagamento, ent=p.entrega;
  const esperandoCartao = p.status==="aguardando_pagamento" && pg.forma===CARTAO && ["pendente","recusado"].includes(pg.status);
  const esperandoPix = p.status==="aguardando_pagamento" && pg.forma==="Pix" && pg.status==="pendente";
  // não refaz a tela enquanto o cliente digita o cartão (a não ser que algo tenha mudado)
  const chave = esperandoCartao ? `${p.id}|${pg.status}|${pg.motivo||""}` : null;
  if(chave && chave===brickChave && $("cartao-brick")) return;
  desmontarBrick(); brickChave = chave;
  $("p-titulo").textContent=`Pedido #${p.codigo}`;
  let h=`<div class="ped-topo"><div class="ped-quando">${quando(p.criadoEm)}</div><span class="pill s-${p.status}">${ROT[p.status]||p.status}</span></div>`;
  if(pagoAgora===p.id) h+=`<div class="ok-box">✓ Pagamento aprovado! Seu pedido entrou na fila da brasa.</div>`;
  if(p.fila && ["novo","em_preparo"].includes(p.status)){
    const f=p.fila, alvo=ent.modo==="Entrega"?"Chega em":"Fica pronto em";
    h+=`<div class="fila"><span>${p.status==="novo"?"🧾":"🔥"}</span><div><b>${p.status==="novo"?(f.naFrente===0?"Você é o próximo da fila!":`Você está na fila: ${f.naFrente+1}º lugar`):"Seu pedido está na brasa!"}</b><small>${alvo} aproximadamente ${f.min}–${f.max} min.</small></div></div>`;
  }
  if(esperandoPix){
    h+=`<div class="pix"><div class="pix-topo"><div><small>Total a pagar</small><strong>${brl(p.total)}</strong></div><div class="pix-relogio" id="pix-relogio"></div></div>
      ${pg.qrImg?`<img class="pix-qr" alt="QR Code do Pix" src="data:image/png;base64,${pg.qrImg}">`:""}
      <p style="margin:0;color:var(--texto-2)">Abra o app do banco → <b>Pix</b> → <b>Copia e Cola</b> e cole o código, ou leia o QR Code.</p>
      <div class="pix-codigo" id="pix-codigo">${esc(pg.qr||"")}</div>
      <button class="btn btn-p" id="pix-copiar" type="button" style="width:100%">Copiar código Pix</button>
      <p style="margin:0;color:var(--texto-2);font-size:14px"><span class="giro" aria-hidden="true"></span> Aguardando o pagamento… esta tela atualiza sozinha.</p></div>`;
  }
  if(esperandoCartao){
    h+=`<div class="pix" style="justify-items:stretch;text-align:left"><div class="pix-topo"><div><small>Total a pagar no cartão</small><strong>${brl(p.total)}</strong></div><div class="pix-relogio" id="pix-relogio"></div></div>
      ${pg.status==="recusado"?`<div class="erro">${esc(pg.motivo||"O cartão foi recusado.")} Você pode tentar de novo.</div>`:""}
      <div id="cartao-brick"><p style="margin:0;color:var(--texto-2)"><span class="giro" aria-hidden="true"></span> Carregando o pagamento seguro…</p></div>
      <p style="margin:0;color:var(--texto-3);font-size:13px">🔒 Os dados do cartão vão direto para o Mercado Pago. A KANANBA não vê nem guarda o número do seu cartão.</p></div>`;
  }
  if(p.status==="cancelado") h+=`<div class="aviso">${p.canceladoPor==="cliente"?"Você desistiu deste pedido e ele foi cancelado. Nada foi cobrado.":pg.status==="expirado"?"O tempo para pagar o Pix acabou e o pedido foi cancelado. É só fazer de novo.":"Este pedido foi cancelado. Qualquer dúvida, fale com a gente pelo WhatsApp."}</div>`;
  else h+=etapasHTML(p);
  const pagTxt = pg.forma==="Pix"||pg.forma===CARTAO ? `${pg.forma} · ${pg.status==="pago"?"pago ✓":pg.status==="pendente"?"aguardando":pg.status==="recusado"?"recusado, tente de novo":pg.status}` : `${pg.forma} · paga na ${ent.modo==="Entrega"?"entrega":"retirada"}${pg.troco?` (troco p/ R$ ${esc(pg.troco)})`:""}`;
  h+=`<div class="rev">
    <div><small>Itens</small>${p.itens.map(i=>`<div>${i.qtd}× ${esc(i.nome)}${i.detalhe?`<div class="si-det">${esc(i.detalhe)}</div>`:""}${i.ponto||i.obs?`<div class="si-obs">⚠ ${esc([i.ponto,i.obs].filter(Boolean).join(" · "))}</div>`:""}</div>`).join("")}</div>
    <div><small>${ent.modo==="Entrega"?"Entrega em":"Recebimento"}</small>${ent.modo==="Entrega"?esc(`${ent.rua}, ${ent.numero}${ent.complemento?" — "+ent.complemento:""} · ${ent.bairro}`):"Retirada no local"}</div>
    <div><small>Pagamento</small>${pagTxt}</div>
    <div class="totais"><div><span>Subtotal</span><span>${brl(p.subtotal)}</span></div><div><span>Entrega</span><span>${p.taxa?brl(p.taxa):"Grátis"}</span></div><div class="t-final"><span>Total</span><span class="preco">${brl(p.total)}</span></div></div></div>`;
  $("p-corpo").innerHTML=h;
  $("p-pe").innerHTML = `${p.podeDesistir?`<button class="btn btn-perigo" type="button" id="d-desistir">Desistir</button>`:""}<button class="btn btn-p" type="button" id="d-ok">${FINAIS.includes(p.status)?"Fazer novo pedido":"Voltar ao cardápio"}</button>`;
  $("pix-copiar")?.addEventListener("click", copiarPix);
  $("d-desistir")?.addEventListener("click", ()=>confirmarDesistir(m));
  $("d-ok").onclick=()=>{ fecharPainel(); mostrar("inicio"); };
  relogioPix(pg.expiraEm);
  if(esperandoCartao) montarBrick(m);
}
function desmontarBrick(){ try{ brickCtrl?.unmount(); }catch(e){} brickCtrl=null; }
function sdkMP(){
  if(window.MercadoPago) return Promise.resolve();
  if(!sdkMP.p) sdkMP.p = new Promise((ok,falha)=>{ const s=document.createElement("script"); s.src="https://sdk.mercadopago.com/js/v2"; s.onload=ok; s.onerror=()=>{ sdkMP.p=null; falha(new Error("sdk")); }; document.head.appendChild(s); });
  return sdkMP.p;
}
async function montarBrick(m){
  if(!CFG.publicKey){ await carregarConfig(); }
  if(!$("cartao-brick") || detalheId!==m.id) return;
  if(!CFG.publicKey){ $("cartao-brick").innerHTML=`<div class="erro">O pagamento com cartão está indisponível agora. Desista deste pedido e faça de novo com Pix ou cartão na entrega.</div>`; return; }
  try{ await sdkMP(); }catch(e){ if($("cartao-brick")){ $("cartao-brick").innerHTML=`<div class="erro">Não deu para carregar o pagamento. Confira sua internet.</div><button class="btn btn-s" type="button" id="brick-retry" style="margin-top:8px;width:100%">Tentar de novo</button>`; $("brick-retry").onclick=()=>{ brickChave=null; pintarDetalhe(); }; } return; }
  if(!$("cartao-brick") || detalheId!==m.id) return;
  $("cartao-brick").innerHTML="";
  const escuro = document.documentElement.getAttribute("data-theme")!=="light";
  const mp = new window.MercadoPago(CFG.publicKey, {locale:"pt-BR"});
  try{
    brickCtrl = await mp.bricks().create("cardPayment", "cartao-brick", {
      initialization:{ amount:m.dados.total },
      customization:{
        paymentMethods:{ maxInstallments:1, types:{ excluded:["debit_card"] } },
        visual:{ style:{ theme: escuro?"dark":"default", customVariables:{ baseColor:"#ff9800", buttonTextColor:"#22160a", formBackgroundColor: escuro?"#161d27":"#F5F7F8", borderRadiusMedium:"12px", borderRadiusLarge:"14px" } },
                 texts:{ formSubmit:`Pagar ${brl(m.dados.total)}` } }
      },
      callbacks:{
        onReady:()=>{},
        onError:(e)=>{ console.warn("brick", e); },
        onSubmit:(dados)=> pagarCartao(m, dados)
      }
    });
  }catch(e){ if($("cartao-brick")) $("cartao-brick").innerHTML=`<div class="erro">Não deu para abrir o pagamento com cartão agora. Tente de novo em instantes.</div>`; }
}
async function pagarCartao(m, dados){
  try{
    const r=await fetch(`/api/pedidos/${encodeURIComponent(m.id)}/cartao?t=${encodeURIComponent(m.token)}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(dados)});
    const d=await r.json().catch(()=>({}));
    if(d.pedido){
      const pagou = m.dados.pagamento.status!=="pago" && d.pedido.pagamento.status==="pago";
      m.dados=d.pedido; salvarMeus(); pintarBadge();
      if(pagou){ pagoAgora=m.id; try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){} }
    } else if(!r.ok) toast(d.erro||"Não foi possível pagar agora.");
  }catch(e){ toast("Sem conexão. Tente de novo."); }
  brickChave=null; setTimeout(()=>{ if(detalheId===m.id) pintarDetalhe(); if(!$("v-pedidos").hidden) pintarPedidos(); },0);
}
async function copiarPix(){
  const m=meus.find(x=>x.id===detalheId), cod=m?.dados?.pagamento?.qr||"", b=$("pix-copiar");
  try{ await navigator.clipboard.writeText(cod); b.textContent="Código copiado ✓"; }
  catch(e){ const r=document.createRange(); r.selectNodeContents($("pix-codigo")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selecionado: copie com Ctrl+C"; }
  setTimeout(()=>{ if($("pix-copiar")) $("pix-copiar").textContent="Copiar código Pix"; },2500);
}
function relogioPix(exp){
  clearInterval(timerRelogio); if(!exp || !$("pix-relogio")) return;
  const t=()=>{ const el=$("pix-relogio"); if(!el){ clearInterval(timerRelogio); return; }
    const s=Math.max(0,Math.round((new Date(exp)-Date.now())/1000));
    el.textContent = s?`Expira em ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:"Tempo esgotado"; };
  t(); timerRelogio=setInterval(t,1000);
}
function confirmarDesistir(m){
  const p=m.dados;
  $("p-pe").innerHTML = `<div style="display:grid;gap:10px;width:100%"><div class="aviso">Desistir do pedido #${esc(p.codigo)}?${p.pagamento.forma==="Pix"&&p.pagamento.status==="pendente"?" O código Pix será cancelado: não pague depois de desistir.":""}</div>
    <div style="display:flex;gap:10px"><button class="btn btn-s" type="button" id="d-nao" style="flex:1">Não, manter</button><button class="btn btn-perigo" type="button" id="d-sim" style="flex:1">Sim, desistir</button></div></div>`;
  $("d-nao").onclick=pintarDetalhe;
  $("d-sim").onclick=async()=>{
    const b=$("d-sim"); b.disabled=true; b.textContent="Cancelando…";
    try{
      const r=await fetch(`/api/pedidos/${encodeURIComponent(m.id)}/cancelar?t=${encodeURIComponent(m.token)}`,{method:"POST"});
      const d=await r.json().catch(()=>({}));
      if(d.pedido){ m.dados=d.pedido; salvarMeus(); }
      if(!r.ok) toast(d.erro||"Não foi possível cancelar agora.");
    }catch(e){ toast("Sem conexão. Tente de novo."); }
    pintarDetalhe(); pintarBadge(); if(!$("v-pedidos").hidden) pintarPedidos();

/* ============ navegação ============ */
function mostrar(v){
  const ped = v==="pedidos";
  $("v-inicio").hidden=ped; $("v-pedidos").hidden=!ped;
  $("nav-inicio").classList.toggle("ativo",!ped); $("nav-pedidos").classList.toggle("ativo",ped);

  if(ped){ pintarPedidos(); atualizarTodos(); }
}
$("nav-inicio").onclick=()=>mostrar("inicio");
$("nav-pedidos").onclick=()=>mostrar("pedidos");
$("ped-voltar").onclick=()=>mostrar("inicio");
const trocaAba=a=>{ abaPed=a; $("tab-and").classList.toggle("ativa",a==="and"); $("tab-fin").classList.toggle("ativa",a==="fin"); $("tab-and").setAttribute("aria-selected",a==="and"); $("tab-fin").setAttribute("aria-selected",a==="fin"); pintarPedidos(); };
$("tab-and").onclick=()=>trocaAba("and"); $("tab-fin").onclick=()=>trocaAba("fin");
$("abrir-sacola").onclick=abrirSacola;
document.addEventListener("click",e=>{
  const ab=e.target.closest("[data-abrir]"); if(ab && ab.getAttribute("aria-disabled")!=="true"){ abrir(ab.dataset.abrir); return; }
  const aba=e.target.closest("[data-aba]"); if(aba){ $("busca-in").value=""; filtrar(); const el=$("s-"+aba.dataset.aba); scrollTo({top:el.getBoundingClientRect().top+scrollY-56,behavior:"smooth"}); return; }
  if(e.target.closest("#aba-topo")) scrollTo({top:0,behavior:"smooth"});
});
addEventListener("scroll",()=>{ cancelAnimationFrame(marcarAba.r); marcarAba.r=requestAnimationFrame(marcarAba); },{passive:true});
$("b-info").onclick=()=>{ const i=$("info"); i.hidden=!i.hidden; $("b-info").setAttribute("aria-expanded",String(!i.hidden)); $("b-info").textContent=i.hidden?"Mais informações":"Menos informações"; if(!i.hidden) carregarFila(); };
$("b-busca").onclick=()=>{ $("busca").hidden=false; $("busca-in").focus(); scrollTo({top:document.querySelector(".abas-wrap").offsetTop,behavior:"smooth"}); };
$("busca-fechar").onclick=()=>{ $("busca-in").value=""; $("busca").hidden=true; filtrar(); };
$("busca-in").oninput=filtrar;
$("b-compart").onclick=async()=>{ const url=location.origin; try{ if(navigator.share) await navigator.share({title:"KANANBA Espetos", url}); else { await navigator.clipboard.writeText(url); toast("Link da loja copiado"); } }catch(e){} };

/* tema claro/escuro (mesmo do site original) */
const ICO_SOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
const ICO_LUA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>';
function pintarTema(){ const claro=document.documentElement.getAttribute("data-theme")==="light"; $("b-tema").innerHTML=claro?ICO_LUA:ICO_SOL; }
$("b-tema").onclick=()=>{ const t=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light"; document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("kananba-tema",t);}catch(e){} pintarTema(); };

/* ============ dados do servidor ============ */
async function carregarConfig(){ try{ const r=await fetch("/api/config"); if(!r.ok) return; CFG=await r.json(); }catch(e){} }
async function carregarFotos(){ try{ const r=await fetch("/api/fotos"); if(!r.ok) return; FOTOS=(await r.json()).fotos||{}; if(Object.keys(FOTOS).length) pintarCardapio(); }catch(e){} }
async function carregarDestaques(){ try{ const r=await fetch("/api/destaques"); if(!r.ok) return; DESTAQUES=await r.json(); pintarCardapio(); }catch(e){} }
async function carregarFila(){
  if(carregarFila.em && Date.now()-carregarFila.em<20000) return; carregarFila.em=Date.now();
  try{ const r=await fetch("/api/fila",{cache:"no-store"}); if(!r.ok) return; FILA=await r.json();
    $("info-fila").textContent = FILA.entrega?` · hoje chega em ${FILA.entrega.min}–${FILA.entrega.max} min`:"";
    if($("prev-txt")) $("prev-txt").textContent=previsaoTxt();
  }catch(e){}
}

/* ============ início ============ */
$("info-hora").textContent = `das ${NEGOCIO.horario.replace(" às "," à ")}`;
$("info-taxa").textContent = NEGOCIO.taxaEntrega==null ? "Taxa a combinar" : `Taxa fixa de ${brl(NEGOCIO.taxaEntrega)}${NEGOCIO.retirada?" ou retirada no local":""}`;
$("info-pag").textContent = NEGOCIO.pagamentos.filter(p=>p!==CARTAO).join(", ");
carregarConfig().then(()=>{ $("info-pag").textContent = formasPag().join(", "); });
$("info-whats").href = `https://wa.me/${NEGOCIO.whatsapp}`;
pintarTema(); pintarStatus(); setInterval(pintarStatus,30000);
pintarAbas(); pintarCardapio(); pintarSacola(); marcarAba(); pintarBadge();
carregarFotos(); carregarDestaques(); atualizarTodos();
if(location.hash==="#pedidos") mostrar("pedidos");
</script>
</body></html>
