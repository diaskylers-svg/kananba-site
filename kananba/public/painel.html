<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KANANBA · Bastidores</title>
<script>try{var t=localStorage.getItem("kananba-tema");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --carvao:#0a0d12; --grelha:#131922; --grelha-2:#161d27; --linha:#1e2530;
  --texto:#e7eaf1; --texto-2:#8b93a4; --texto-3:#565f70;
  --brasa:#ff9800; --brasa-forte:#FFB65C; --brasa-fundo:rgba(255,152,0,.16); --sobre-brasa:#22160a;
  --ok:#4CAF50; --ok-fundo:rgba(76,175,80,.15);
  --azul:#8FA1F0; --azul-fundo:rgba(143,161,240,.14);
  --aviso:#f0a63c; --aviso-fundo:rgba(240,166,60,.14);
  --perigo:#ef6b5b; --perigo-fundo:rgba(239,107,91,.14);
  --f-display:"Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --f-corpo:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --carvao:#EEF1F2; --grelha:#FFFFFF; --grelha-2:#F5F7F8; --linha:#D7DCDF;
  --texto:#1B222B; --texto-2:#5B6570; --texto-3:#8A93A0;
  --brasa-forte:#C97200; --brasa-fundo:rgba(255,152,0,.14);
  --ok:#2E7D32; --ok-fundo:rgba(46,125,50,.10);
  --azul:#212C79; --azul-fundo:#EEF0FB;
  --aviso:#B4720E; --aviso-fundo:rgba(180,114,14,.12);
  --perigo:#B23A3A; --perigo-fundo:rgba(178,58,58,.10);
}
:root[data-theme="light"] .topo{background:rgba(238,241,242,.95)}
:root[data-theme="light"] .card,:root[data-theme="light"] .num{box-shadow:0 1px 2px rgba(27,34,43,.06),0 12px 32px -16px rgba(27,34,43,.18)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--carvao);color:var(--texto);font-family:var(--f-corpo);font-size:16px;line-height:1.4;min-height:100vh;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;cursor:pointer}
a{color:var(--brasa-forte)}
input{font:inherit;color:var(--texto);background:var(--grelha-2);border:1px solid var(--linha);border-radius:10px;padding:12px 14px;width:100%}
input:focus{outline:none;border-color:var(--brasa);box-shadow:0 0 0 3px var(--brasa-fundo)}
:focus-visible{outline:2px solid var(--brasa);outline-offset:2px}

.marca{font-family:var(--f-display);font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.marca b{color:var(--brasa)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--brasa);color:var(--sobre-brasa)}
.btn:disabled{opacity:.5;cursor:default}
.btn-sec{border:1px solid var(--linha);background:transparent;border-radius:12px;padding:10px 14px;color:var(--texto-2);font-weight:600}
.btn-sec:hover{border-color:var(--texto-3);color:var(--texto)}
.btn-perigo{border:1px solid transparent;background:transparent;color:var(--perigo);font-weight:600;padding:10px 8px;border-radius:12px}
.btn-perigo:hover{background:var(--perigo-fundo)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login form{width:min(380px,100%);background:var(--grelha);border:1px solid var(--linha);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login .marca{font-size:44px}
.login p{margin:0;color:var(--texto-2);font-size:15px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--texto-2)}
.lembrar{flex-direction:row!important;align-items:center;gap:8px!important;font-weight:500!important}
.lembrar input{width:18px;height:18px;accent-color:var(--brasa)}
.erro-login{color:var(--perigo);font-size:14px;min-height:1em;margin:0}

/* ---------- topo ---------- */
.topo{position:sticky;top:0;z-index:5;background:rgba(10,13,18,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo-in{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topo .marca{font-size:30px}
.topo .marca small{display:block;font-family:var(--f-corpo);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--texto-3);margin-top:2px}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topo input[type=date]{width:auto;padding:9px 10px}
.vivo{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--texto-3)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.vivo.off i{background:var(--perigo)}
@media (prefers-reduced-motion:no-preference){.vivo i{animation:pisca 2s infinite}@keyframes pisca{50%{opacity:.3}}}
.som[aria-pressed="false"]{color:var(--texto-3)}
@media (max-width:600px){.topo{position:static}.topo-in{gap:8px}.topo-acoes{width:100%;gap:6px}.topo input[type=date]{flex:1;min-width:0}.vivo{width:100%}.btn-sec{padding:9px 12px}}

main{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
.aviso-cfg{background:var(--aviso-fundo);border:1px solid var(--aviso);color:var(--aviso);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}

/* ---------- números ---------- */
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.num{background:var(--grelha);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.num small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3)}
.num strong{font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}

/* ---------- abas ---------- */
.abas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.aba{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--linha);background:var(--grelha-2);color:var(--texto-2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px}
.aba[aria-selected="true"]{background:var(--brasa);border-color:var(--brasa);color:var(--sobre-brasa)}
.aba .cont{min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:13px;background:var(--linha);color:var(--texto)}
.aba[aria-selected="true"] .cont{background:rgba(0,0,0,.18);color:var(--sobre-brasa)}
.aba.chama .cont{background:var(--perigo);color:#fff}

/* ---------- cartões ---------- */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
@media (max-width:400px){.grade{grid-template-columns:1fr}}
.vazio{color:var(--texto-3);text-align:center;padding:48px 16px;border:1px dashed var(--linha);border-radius:14px}
.card{background:var(--grelha);border:1px solid var(--linha);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.recente{border-color:var(--brasa);box-shadow:0 0 0 3px var(--brasa-fundo)}
@media (prefers-reduced-motion:no-preference){.card.recente{animation:chega 1.2s ease 3}@keyframes chega{50%{box-shadow:0 0 0 7px var(--brasa-fundo)}}}
.c-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.c-cod{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.c-hora{font-size:13px;color:var(--texto-3);margin-top:2px}
.c-tags{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tag-pago{background:var(--ok-fundo);color:var(--ok)}
.tag-pendente{background:var(--aviso-fundo);color:var(--aviso)}
.tag-entrega{background:var(--azul-fundo);color:var(--azul)}
.tag-cinza{background:var(--grelha-2);color:var(--texto-3)}
.tag-modo{background:var(--grelha-2);color:var(--texto-2)}
.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.itens li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.q{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--brasa-forte);min-width:32px}
.i-nome{font-weight:600}
.i-preco{color:var(--texto-3);font-size:14px;font-variant-numeric:tabular-nums}
.i-obs{grid-column:2 / -1;color:var(--aviso);font-size:14px;font-weight:600}
.obs-geral{border:1.5px dashed var(--aviso);background:var(--aviso-fundo);color:var(--aviso);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
.dados{display:flex;flex-direction:column;gap:6px;font-size:15px;border-top:1px solid var(--linha);padding-top:10px}
.dados small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3);display:block}
.dados .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.dados a{font-size:14px;font-weight:600;text-decoration:none}
.totais{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--linha);padding-top:10px;font-variant-numeric:tabular-nums}
.totais span{color:var(--texto-3);font-size:14px}
.totais strong{font-family:var(--f-display);font-size:26px}
.c-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.c-acoes .btn{flex:1;min-width:160px}
.c-acoes .direita{margin-left:auto;display:flex;gap:4px}

/* ---------- impressão ---------- */
@media print{
  body{background:#fff;color:#000}
  body.imprimindo > *:not(main){display:none!important}
  body.imprimindo main > *:not(.grade){display:none!important}
  body.imprimindo .card:not(.alvo){display:none!important}
  body.imprimindo .card.alvo{border:0;box-shadow:none;color:#000;background:#fff}
  body.imprimindo .c-acoes, body.imprimindo .dados a{display:none!important}
  body.imprimindo *{color:#000!important;background:#fff!important}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="tela-login">
  <form id="form-login">
    <div class="marca">KANAN<b>BA</b></div>
    <p>Bastidores · pedidos e pagamentos</p>
    <label>Senha do painel<input type="password" id="senha" autocomplete="current-password" required></label>
    <label class="lembrar"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <p class="erro-login" id="erro-login" role="alert"></p>
    <button class="btn" type="submit" id="btn-entrar">Entrar</button>
  </form>
</section>

<!-- PAINEL -->
<div id="tela-painel" hidden>
  <header class="topo">
    <div class="topo-in">
      <div class="marca">KANAN<b>BA</b><small>BASTIDORES</small></div>
      <div class="topo-acoes">
        <span class="vivo" id="vivo"><i></i><span id="vivo-txt">ao vivo</span></span>
        <input type="date" id="dia" aria-label="Dia">
        <button class="btn-sec" id="btn-tema" type="button"></button>
        <button class="btn-sec som" id="btn-som" type="button" aria-pressed="true" title="Som de novo pedido">🔔 Som</button>
        <button class="btn-sec" id="btn-sair" type="button">Sair</button>
      </div>
    </div>
  </header>
  <main>
    <div class="aviso-cfg" id="aviso-pix" hidden>O Pix ainda não está configurado (falta o MP_ACCESS_TOKEN na Netlify). Os clientes só conseguem pagar na entrega.</div>
    <div class="numeros" id="numeros"></div>
    <div class="abas" id="abas" role="tablist"></div>
    <div class="grade" id="grade"></div>
  </main>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hora = iso => new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});
const fmtCPF = c => (c||"").replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4");
const fmtTel = t => t.length===11 ? `(${t.slice(0,2)}) ${t.slice(2,7)}-${t.slice(7)}` : t.length===10 ? `(${t.slice(0,2)}) ${t.slice(2,6)}-${t.slice(6)}` : t;
const guardar = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };
const ler = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };

let senha = ler("kananba-painel-senha") || sessionStorage.getItem?.("kananba-painel-senha") || "";
let dados = null, abaAtual = "novos", diaEscolhido = null, timer = null, somLigado = ler("kananba-painel-som") !== "0";
const vistos = new Set(JSON.parse(ler("kananba-painel-vistos") || "[]"));
const recentes = new Set();
let primeiraCarga = true;

const ABAS = [
  {id:"novos",     rot:"Novos",          f:p => p.status==="novo", chama:true},
  {id:"preparo",   rot:"Na brasa",       f:p => p.status==="em_preparo"},
  {id:"rua",       rot:"Na rua / Prontos", f:p => p.status==="saiu" || p.status==="pronto"},
  {id:"pix",       rot:"Aguardando Pix", f:p => p.status==="aguardando_pagamento"},
  {id:"concluidos",rot:"Concluídos",     f:p => p.status==="concluido"},
  {id:"cancelados",rot:"Cancelados",     f:p => p.status==="cancelado"}
];

/* ---------- API ---------- */
async function api(caminho, opcoes={}){
  const r = await fetch(`/api/painel/${caminho}`, {...opcoes, headers:{"x-painel-senha":senha, "content-type":"application/json", ...(opcoes.headers||{})}});
  const d = await r.json().catch(()=>({}));
  if(r.status===401){ sair("Senha incorreta."); throw new Error("401"); }
  if(!r.ok) throw new Error(d.erro || `Erro ${r.status}`);
  return d;
}

/* ---------- login ---------- */
$("form-login").onsubmit = async e => {
  e.preventDefault();
  senha = $("senha").value; $("erro-login").textContent = ""; $("btn-entrar").disabled = true;
  try{
    await api("ping");
    if($("lembrar").checked) guardar("kananba-painel-senha", senha); else { guardar("kananba-painel-senha", null); try{sessionStorage.setItem("kananba-painel-senha", senha);}catch(e){} }
    destravarSom();
    entrar();
  }catch(err){ if(err.message!=="401") $("erro-login").textContent = err.message; }
  finally{ $("btn-entrar").disabled = false; }
};
function entrar(){ $("tela-login").hidden = true; $("tela-painel").hidden = false; carregar(); }
function sair(msg){
  clearTimeout(timer); senha = ""; guardar("kananba-painel-senha", null); try{sessionStorage.removeItem("kananba-painel-senha");}catch(e){}
  $("tela-painel").hidden = true; $("tela-login").hidden = false; $("erro-login").textContent = msg || ""; $("senha").value = ""; $("senha").focus();
}
$("btn-sair").onclick = () => sair();

/* ---------- som de novo pedido ---------- */
let audio = null;
function destravarSom(){ try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); }catch(e){} }
function tocar(){
  if(!somLigado || !audio) return;
  const t0 = audio.currentTime;
  [0, .22, .44, 1.1, 1.32, 1.54].forEach((dt,i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = i%3===2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t0+dt); g.gain.exponentialRampToValueAtTime(0.35, t0+dt+.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+dt+.18);
    o.connect(g).connect(audio.destination); o.start(t0+dt); o.stop(t0+dt+.2);
  });
}
$("btn-som").setAttribute("aria-pressed", somLigado);
$("btn-som").onclick = () => { somLigado = !somLigado; guardar("kananba-painel-som", somLigado?"1":"0"); $("btn-som").setAttribute("aria-pressed", somLigado); $("btn-som").textContent = somLigado ? "🔔 Som" : "🔕 Mudo"; destravarSom(); if(somLigado) tocar(); };
document.addEventListener("pointerdown", destravarSom, {once:true});

/* ---------- carregar ---------- */
$("dia").onchange = () => { diaEscolhido = $("dia").value || null; carregar(); };
async function carregar(){
  clearTimeout(timer);
  try{
    dados = await api(`pedidos${diaEscolhido?`?dia=${diaEscolhido}`:""}`);
    $("vivo").classList.remove("off"); $("vivo-txt").textContent = "ao vivo · " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    if(!$("dia").value) $("dia").value = dados.dia;
    $("aviso-pix").hidden = dados.pixAtivo;
    detectarNovos();
    render();
  }catch(e){
    if(e.message==="401") return;
    $("vivo").classList.add("off"); $("vivo-txt").textContent = "sem conexão, tentando de novo…";
  }
  timer = setTimeout(carregar, 5000);
}

function detectarNovos(){
  let chegou = false;
  for(const p of dados.pedidos){
    if(p.status==="novo" && !vistos.has(p.id)){
      vistos.add(p.id);
      if(!primeiraCarga){ chegou = true; recentes.add(p.id); }
    }
  }
  guardar("kananba-painel-vistos", JSON.stringify([...vistos].slice(-300)));
  if(chegou){ tocar(); piscarTitulo(); if(abaAtual!=="novos"){ abaAtual="novos"; } }
  primeiraCarga = false;
}
let piscando = null;
function piscarTitulo(){
  clearInterval(piscando); let n = 0;
  piscando = setInterval(() => { document.title = (n++ % 2) ? "KANANBA · Bastidores" : "🔥 NOVO PEDIDO!"; if(n>20 || !document.hidden && n>6){ clearInterval(piscando); document.title = "KANANBA · Bastidores"; } }, 700);
}

/* ---------- render ---------- */
function render(){
  const ps = dados.pedidos;
  const validos = ps.filter(p => p.status!=="cancelado" && p.status!=="aguardando_pagamento");
  const faturado = validos.reduce((s,p) => s + p.total, 0);
  const pixPago = ps.filter(p => p.pagamento.status==="pago").reduce((s,p) => s + (p.pagamento.valorPago ?? p.total), 0);
  const naEntrega = validos.filter(p => p.pagamento.status==="na_entrega").reduce((s,p) => s + p.total, 0);
  $("numeros").innerHTML = `
    <div class="num"><small>Pedidos</small><strong>${validos.length}</strong></div>
    <div class="num"><small>Total do dia</small><strong>${brl(faturado)}</strong></div>
    <div class="num"><small>Recebido no Pix</small><strong style="color:var(--ok)">${brl(pixPago)}</strong></div>
    <div class="num"><small>A receber na entrega</small><strong style="color:var(--azul)">${brl(naEntrega)}</strong></div>`;

  $("abas").innerHTML = ABAS.map(a => {
    const n = ps.filter(a.f).length;
    return `<button class="aba ${a.chama&&n?"chama":""}" role="tab" data-aba="${a.id}" aria-selected="${a.id===abaAtual}">${a.rot}<span class="cont">${n}</span></button>`;
  }).join("");
  $("abas").querySelectorAll(".aba").forEach(b => b.onclick = () => { abaAtual = b.dataset.aba; render(); });

  const aba = ABAS.find(a => a.id===abaAtual);
  let lista = ps.filter(aba.f);
  if(["novos","preparo","rua"].includes(abaAtual)) lista = lista.slice().reverse(); // mais antigos primeiro na fila
  $("grade").innerHTML = lista.length ? lista.map(cartao).join("") : `<div class="vazio">${abaAtual==="novos"?"Nenhum pedido novo agora. Quando chegar, toca o alarme. 🔔":"Nada por aqui."}</div>`;
  $("grade").querySelectorAll("[data-acao]").forEach(b => b.onclick = () => agir(b.dataset.id, b.dataset.acao, b));
}

function tagPagamento(p){
  const pg = p.pagamento;
  if(pg.forma==="Pix"){
    if(pg.status==="pago") return `<span class="tag tag-pago">✓ Pix pago</span>`;
    if(pg.status==="pendente") return `<span class="tag tag-pendente">⏳ Aguardando Pix</span>`;
    if(pg.status==="expirado") return `<span class="tag tag-cinza">Pix expirou</span>`;
    if(pg.status==="devolvido") return `<span class="tag tag-cinza">Pix devolvido</span>`;
    return `<span class="tag tag-cinza">Pix ${esc(pg.status)}</span>`;
  }
  return `<span class="tag tag-entrega">Cobrar: ${esc(pg.forma)}</span>`;
}

function botoes(p){
  const e = p.entrega.modo==="Entrega";
  const prox = {
    novo: ["em_preparo","🔥 Começar preparo"],
    em_preparo: e ? ["saiu","🛵 Saiu para entrega"] : ["pronto","✅ Pronto para retirar"],
    saiu: ["concluido","Entregue"],
    pronto: ["concluido","Retirado"]
  }[p.status];
  const pode = !(p.status==="novo" && p.pagamento.status==="pendente");
  let h = "";
  if(prox) h += `<button class="btn" data-acao="${prox[0]}" data-id="${p.id}" ${pode?"":"disabled"}>${prox[1]}</button>`;
  h += `<span class="direita"><button class="btn-sec" data-acao="imprimir" data-id="${p.id}">Imprimir</button>`;
  if(!["concluido","cancelado"].includes(p.status)) h += `<button class="btn-perigo" data-acao="cancelado" data-id="${p.id}">Cancelar</button>`;
  return h + `</span>`;
}

function cartao(p){
  const ent = p.entrega, c = p.cliente;
  const endereco = ent.modo==="Entrega" ? `${ent.rua}, ${ent.numero}${ent.complemento?" — "+ent.complemento:""} · ${ent.bairro}${ent.cidade?" · "+ent.cidade:""}` : "";
  const mapa = ent.modo==="Entrega" ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${ent.rua}, ${ent.numero==="s/n"?"":ent.numero}, ${ent.bairro}, ${ent.cidade||""}`)}` : "";
  const pg = p.pagamento;
  const minutos = Math.round((Date.now()-new Date(p.criadoEm))/60000);
  return `<article class="card ${recentes.has(p.id)?"recente":""}" id="card-${p.id}">
    <div class="c-topo">
      <div><div class="c-cod">#${esc(p.codigo)}</div><div class="c-hora">${hora(p.criadoEm)} · há ${minutos<60?minutos+" min":Math.floor(minutos/60)+"h"+String(minutos%60).padStart(2,"0")}</div></div>
      <div class="c-tags">${tagPagamento(p)}<span class="tag tag-modo">${ent.modo==="Entrega"?"🛵 Entrega":"🏃 Retirada"}</span></div>
    </div>
    <ul class="itens">${p.itens.map(i => `<li><span class="q">${i.qtd}×</span><span class="i-nome">${esc(i.nome)}</span><span class="i-preco">${brl(i.total)}</span>${i.detalhe?`<span class="i-obs" style="color:var(--texto)">🍢 ${esc(i.detalhe)}</span>`:""}${i.ponto||i.obs?`<span class="i-obs">⚠ ${esc([i.ponto,i.obs].filter(Boolean).join(" · "))}</span>`:""}</li>`).join("")}</ul>
    ${p.obsGeral?`<div class="obs-geral">⚠ ${esc(p.obsGeral)}</div>`:""}
    <div class="dados">
      <div><small>Cliente</small><div class="linha"><strong>${esc(c.nome)}</strong> <span style="color:var(--texto-3)">CPF ${fmtCPF(c.cpf)}</span></div></div>
      <div class="linha">${fmtTel(c.tel)} <a href="tel:+55${c.tel}">Ligar</a>${c.telWhats?` <a href="https://wa.me/55${c.tel}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>
      ${ent.modo==="Entrega"?`<div><small>Endereço</small>${esc(endereco)}${ent.referencia?`<br><span style="color:var(--texto-2)">Ref.: ${esc(ent.referencia)}</span>`:""}<div class="linha"><a href="${mapa}" target="_blank" rel="noopener">Abrir no mapa</a></div></div>`:""}
      ${pg.forma==="Dinheiro"&&pg.troco?`<div><small>Troco</small>Levar troco para R$ ${esc(pg.troco)}</div>`:""}
    </div>
    <div class="totais"><span>Itens ${brl(p.subtotal)}${p.taxa?` + entrega ${brl(p.taxa)}`:""}</span><strong>${brl(p.total)}</strong></div>
    <div class="c-acoes">${botoes(p)}</div>
  </article>`;
}

async function agir(id, acao, botao){
  if(acao==="imprimir"){
    const card = $("card-"+id); card.classList.add("alvo"); document.body.classList.add("imprimindo");
    window.print();
    setTimeout(() => { card.classList.remove("alvo"); document.body.classList.remove("imprimindo"); }, 500);
    return;
  }
  const p = dados.pedidos.find(x => x.id===id);
  if(acao==="cancelado"){
    const aviso = p.pagamento.status==="pago" ? "\n\nEsse pedido já foi PAGO no Pix. Se cancelar, devolva o dinheiro pelo app do Mercado Pago." : "";
    if(!confirm(`Cancelar o pedido #${p.codigo}?${aviso}`)) return;
  }
  botao.disabled = true;
  try{
    const d = await api("status", {method:"POST", body:JSON.stringify({id, status:acao})});
    Object.assign(p, d.pedido); recentes.delete(id);
    render();
  }catch(e){ if(e.message!=="401") alert(e.message); botao.disabled = false; }
}

/* ---------- tema ---------- */
function aplicarTema(t){
  document.documentElement.setAttribute("data-theme", t);
  guardar("kananba-tema", t);
  $("btn-tema").textContent = t==="light" ? "☾ Escuro" : "☀ Claro";
}
$("btn-tema").onclick = () => aplicarTema(document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light");
aplicarTema(document.documentElement.getAttribute("data-theme")==="light" ? "light" : "dark");

/* ---------- início ---------- */
if(senha){ api("ping").then(entrar).catch(()=>{}); } else { $("senha").focus(); }
setInterval(() => { if(dados && !$("tela-painel").hidden) render(); }, 60000); // atualiza o "há X min"
</script>
